{% extends "hrm/base.html" %}
{% block content %}
<div class="card shadow-sm" style="max-width: 600px; margin: 0 auto;">
    <div class="card-body">
        <h3 class="card-title">{% if object %}Редактировать{% else %}Добавить{% endif %} сотрудника</h3>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success w-100">Сохранить</button>
        </form>
    </div>
</div>
{% endblock %}
